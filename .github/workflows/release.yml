# Verify the tokens, and tag a release when the version in package.json changes.
#
# WHY THIS EXISTS: an agent session cannot create git refs — pushing a tag and
# POSTing to the refs API are both blocked. Actions runs inside GitHub with its
# own token, so it can. Without this, every release is hand-tagged from a local
# clone, forever.
#
# THE VERIFY JOB IS NOT A REQUIRED STATUS CHECK, AND MUST NOT BECOME ONE.
# Branch protection here deliberately omits required checks — see the handoff
# brief §8. A check that runs and reports is useful; a *required* check that
# fails to report blocks every merge permanently. Leave it advisory.
#
# The release job cuts the tag only when package.json's version has no tag yet,
# so it is safe to re-run and safe on any merge that does not bump the version.

name: Verify and release

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No install step — the verifier has zero dependencies, by design.
      - name: Check contrast, gamut, chroma ceiling, hue bands, parity, completeness
        run: npm run verify

      # `verify` checks the tokens; this checks `verify`. It once reported "All
      # gates pass" with --data-8 deleted, so the gates are themselves tested
      # against broken input — see SPEC §7.3. A suite that never runs in CI is
      # the same hole in a different shape.
      - name: Prove the gates reject broken tokens
        run: npm test

  release:
    name: Tag if the version changed
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Read the version
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Has this version already been tagged?
        id: check
        run: |
          if git ls-remote --exit-code --tags origin \
              "refs/tags/v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v${{ steps.v.outputs.version }} already tagged — nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag and publish the release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="v${{ steps.v.outputs.version }}"
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$V" -m "$V"
          git push origin "$V"

          # Built with echo rather than a heredoc: YAML block scalars re-indent
          # heredoc bodies, and backticks inside double quotes would be command
          # substitution. Single-quoted fence lines keep both harmless.
          {
            echo 'Pin this release:'
            echo
            echo '```bash'
            echo "npm i github:kwpledger/kwpledger-design#$V"
            echo '```'
            echo
            echo 'Every token gate passed on this commit — WCAG contrast in both'
            echo 'themes, sRGB gamut, the chroma ceiling, the excluded hue bands,'
            echo 'and categorical parity. See docs/SPEC.md §7.'
          } > "$RUNNER_TEMP/notes.md"

          gh release create "$V" --title "$V" --notes-file "$RUNNER_TEMP/notes.md"

      # Consumers pin, so a release reaches nobody until somebody merges it.
      # The pinned consumers each run their own drift check and will notice on
      # their next push or weekly run. The HANDS-ON ones — Base44, Substack, the
      # fixed-canvas formats — have no build and cannot poll anything, so this
      # roster is the entire mechanism for them. See docs/CONSUMERS.md.
      #
      # This announces; it never updates. Automatic propagation is precisely
      # what pinning exists to prevent.
      #
      # Why the announcement lives here and the pin check does not: this repo is
      # public and several consumers are private, so reading their pins from
      # here would need a cross-repo credential in a public repo's secrets. A
      # consumer reading a public remote needs none.
      - name: Open the consumer checklist
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="v${{ steps.v.outputs.version }}"

          ROSTER=$(sed -n '/<!-- consumers:start -->/,/<!-- consumers:end -->/p' \
                     docs/CONSUMERS.md | sed '/<!-- consumers:/d')
          if [ -z "$(echo "$ROSTER" | tr -d '[:space:]')" ]; then
            echo "::error::No roster found between the markers in docs/CONSUMERS.md."
            echo "::error::Refusing to open an empty checklist."
            exit 1
          fi

          # echo rather than a heredoc, for the reason given above.
          {
            echo "\`$V\` is tagged and released."
            echo
            echo 'Nothing has taken it yet — consumers pin, deliberately. This is'
            echo 'the offer, not the update.'
            echo
            echo "$ROSTER"
            echo
            echo 'The pinned consumers will also raise this themselves on their'
            echo 'next push or weekly check, so their boxes may already be handled'
            echo 'by the time you read this. The hands-on ones will not — this list'
            echo 'is the only thing that reaches them.'
            echo
            echo '<sub>Opened automatically by `.github/workflows/release.yml`'
            echo 'from the roster in `docs/CONSUMERS.md`.</sub>'
          } > "$RUNNER_TEMP/checklist.md"

          gh issue create \
            --title "$V — consumers to update" \
            --body-file "$RUNNER_TEMP/checklist.md"
